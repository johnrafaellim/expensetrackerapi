spring.application.name=expensetrackerapi

# JDBC URL used by Spring Boot to connect to the MySQL database.
# localhost:3307 points to the MySQL Docker container exposed on port 3307.
# expense_tracker is the name of the database.
spring.datasource.url=jdbc:mysql://localhost:3307/expense_tracker?serverTimezone=Asia/Manila

# MySQL database username used for authentication.
spring.datasource.username=expense_user

# Password for the specified MySQL database user.
spring.datasource.password=expense_password

# Automatically updates the database schema based on your JPA entities.
# Creates missing tables and adds/updates columns without dropping existing data.
spring.jpa.hibernate.ddl-auto=update

# Displays SQL queries generated by Hibernate in the application console.
# Useful for debugging and monitoring database operations during development.
spring.jpa.show-sql=true

# Disables Open Session in View to prevent database queries during web response rendering.
spring.jpa.open-in-view=false

server.servlet.context-path=/api/v1